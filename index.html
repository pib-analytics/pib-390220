<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Защищённый документ</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --text:#16202f; --muted:#66788d; --line:#dde5ef;
  --accent:#1f3864; --accent2:#159a9c; --err:#c0392b; --shadow:0 10px 30px rgba(23,42,74,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c121b; --card:#141e2c; --text:#e7eef7; --muted:#93a4b8; --line:#26344a;
    --accent:#8fb3f0; --accent2:#31b9bb; --err:#ff7b6e;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  input[type=password]{background:#101a27}
  .eye:hover{background:#1a2536}
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100%; display:flex; align-items:center; justify-content:center;
  padding:24px; background:
    radial-gradient(900px 500px at 12% -10%, rgba(21,154,156,.16), transparent 60%),
    radial-gradient(800px 480px at 110% 110%, rgba(31,56,100,.18), transparent 62%),
    var(--bg);
  color:var(--text); font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.55;
}
.card{
  width:100%; max-width:430px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:30px 28px 26px; box-shadow:var(--shadow);
}
.mark{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#1f3864,#159a9c); color:#fff; margin-bottom:16px;
}
.mark svg{width:22px;height:22px}
h1{font-size:19px; margin:0 0 6px; font-weight:650; letter-spacing:-.01em}
p.sub{margin:0 0 20px; color:var(--muted); font-size:13.5px}
label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); margin:0 0 6px}
.field{position:relative}
input[type=password]{
  width:100%; padding:11px 44px 11px 13px; font-size:15px; font-family:inherit;
  border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text);
  outline:none; transition:border-color .15s, box-shadow .15s;
}
input[type=password]:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(21,154,156,.16)}
.eye{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  border:0; background:transparent; color:var(--muted); cursor:pointer; padding:7px; border-radius:8px;
  font-size:12px;
}
.eye:hover{background:var(--bg); color:var(--text)}
button.go{
  margin-top:14px; width:100%; padding:11px 16px; border:0; border-radius:10px; cursor:pointer;
  background:linear-gradient(135deg,#1f3864,#256e77); color:#fff; font-size:14.5px; font-weight:600;
  font-family:inherit; transition:filter .15s, opacity .15s;
}
button.go:hover{filter:brightness(1.08)}
button.go:disabled{opacity:.6; cursor:default}
.msg{margin-top:12px; font-size:13px; min-height:18px}
.msg.err{color:var(--err)}
.msg.ok{color:#1e8449}
.hint{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
  font-size:12px; color:var(--muted)}
.hint b{color:var(--text); font-weight:600}
@media (prefers-color-scheme: dark){
  .msg.ok{color:#4ecb86}
}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10.5" width="16" height="10" rx="2.2"></rect>
      <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"></path>
      <circle cx="12" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle>
    </svg>
  </div>
  <h1>Документ защищён</h1>
  <p class="sub">Введите пароль, чтобы открыть аналитическую записку.</p>

  <form id="form" autocomplete="off">
    <label for="pw">Пароль</label>
    <div class="field">
      <input id="pw" type="password" name="pw" autocomplete="current-password"
             spellcheck="false" autocapitalize="off" autofocus>
      <button class="eye" type="button" id="eye" aria-label="Показать пароль">Показать</button>
    </div>
    <button class="go" type="submit" id="go">Открыть</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>

  <div class="hint">
    <b>Содержимое зашифровано</b> (AES-256-GCM). Пароль не хранится на сервере и не передаётся:
    расшифровка происходит только в вашем браузере.
  </div>
</main>

  var form = document.getElementById("form");
  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var eye = document.getElementById("eye");

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function subtle() {
    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }

  async function derive(password) {
    var s = subtle();
    var base = await s.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return s.deriveKey(
      { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }

  async function unlock(password) {
    var s = subtle();
    var key = await derive(password);
    var plain = await s.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
    return new TextDecoder("utf-8").decode(plain);
  }

  eye.addEventListener("click", function () {
    var shown = pw.type === "text";
    pw.type = shown ? "password" : "text";
    eye.textContent = shown ? "Показать" : "Скрыть";
    pw.focus();
